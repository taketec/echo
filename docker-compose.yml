version: "3.9"

services:
  frontend:
    build: ./frontend
    container_name: vite_frontend
    ports:
      - "5173:80"
    environment:
      VITE_BACKEND_URL: http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
  backend:
    build: ./backend
    container_name: node_backend
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PROD_URL: mongodb://mongodb:27017/echo
      REDIS_URL: redis://redis:6379
      SECRET: abcd
    depends_on:
      - redis
      - mongo
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  redis_data:
  mongo_data: